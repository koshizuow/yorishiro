[package]
name = "katashiro-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Katashiro's Live2D model reader and deformer, from the ayagami crate"
publish = false

[dependencies]
byteorder = "1.5.0"
derive_more = { version = "2.1.1", features = ["debug", "display"] }
glam = { version = "0.33.1", features = ["zerocopy"] }
log = "0.4.32"
paste = "1.0.15"
serde = "1.0.228"
serde_derive = "1.0.228"
static_assertions = "1.1.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.18"
zerocopy = { version = "0.8.52", features = ["std"] }
zerocopy-derive = "0.8.52"

[lib]
name = "katashiro_core"
