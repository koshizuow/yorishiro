[package]
name = "yorishiro-tracking"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Yorishiro's face tracking core: landmarks to ARKit 52 and VTube Studio style inputs (Phase B)"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
nalgebra = "0.33"
npyz = { version = "0.8", features = ["npz"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
serde_json = "1.0.154"
v4l = "0.14.0"

[features]
# ncnn with Vulkan for the landmark and hand models (the GPU path); needs ncnn built with
# NCNN_VULKAN and NCNN_SHARED_LIB, found through NCNN_DIR (its install prefix)
ncnn = ["dep:cc"]

[build-dependencies]
cc = { version = "1.10.0", optional = true }
