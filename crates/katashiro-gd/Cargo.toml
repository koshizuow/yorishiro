[package]
name = "katashiro-gd"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# animated pictures for items and backgrounds (anim_image.rs)
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp"] }
katashiro-core = { path = "../katashiro" }
fastxfix = "1.0.0"
glob = "0.3.3"
godot = { version = "0.5.4", features = ["experimental-threads"] }
serde = "1.0.229"
serde_json = "1.0.151"
