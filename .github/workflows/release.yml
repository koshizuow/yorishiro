# Builds a release when a version tag is pushed, in the same container as tools/release/podman_build.sh,
# starts it on stock distributions, records build provenance, and uploads everything to a draft release.
# The release notes are written by hand and the draft published after; signing (tools/release/sign.sh) stays
# on the maintainer's machine, so the secret key never reaches CI.
#
# The tracking models are not in git (research tools make them): the release models-v1 holds them as
# models-v1.tar.gz, and build.sh checks them against models/SHA256SUMS. A new set goes up as models-v2 and
# MODELS_RELEASE below changes with it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # the draft release
  id-token: write       # build provenance
  attestations: write

env:
  MODELS_RELEASE: models-v1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tracking models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MODELS_RELEASE" -p "$MODELS_RELEASE.tar.gz" -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/models"
          tar xzf "$RUNNER_TEMP/$MODELS_RELEASE.tar.gz" -C "$RUNNER_TEMP/models"
          (cd "$RUNNER_TEMP/models" && sha256sum -c --quiet "$GITHUB_WORKSPACE/models/SHA256SUMS")

      # Godot, its export template (1.3 GB download) and ncnn, as build.sh keeps them between builds
      - uses: actions/cache@v4
        with:
          path: release-cache
          key: release-cache-${{ hashFiles('tools/release/build.sh', 'tools/build_ncnn.sh') }}

      - name: Build
        run: |
          podman build -q -t yorishiro-release tools/release
          mkdir -p release-cache/cargo-registry out
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/build/src" -v "$RUNNER_TEMP/models:/build/models:ro" \
            -v "$GITHUB_WORKSPACE/release-cache:/build/cache" -v "$GITHUB_WORKSPACE/release-cache/cargo-registry:/opt/cargo/registry" \
            -v "$GITHUB_WORKSPACE/out:/build/out" \
            -e MODELS_DIR=/build/models -e CACHE_DIR=/build/cache -e OUT_DIR=/build/out \
            yorishiro-release /build/src/tools/release/build.sh "$GITHUB_REF_NAME"

      - name: Start on stock distributions
        run: tools/release/check_appimage.sh "out/Yorishiro-$GITHUB_REF_NAME-x86_64.AppImage"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/Yorishiro-${{ github.ref_name }}-x86_64.AppImage
            out/Yorishiro-${{ github.ref_name }}-x86_64.AppImage.zsync
            out/yorishiro-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
            --notes "Draft from CI: write the notes, sign SHA256SUMS-$GITHUB_REF_NAME (tools/release/sign.sh), upload the .minisig, publish." \
            "out/Yorishiro-$GITHUB_REF_NAME-x86_64.AppImage" \
            "out/Yorishiro-$GITHUB_REF_NAME-x86_64.AppImage.zsync" \
            "out/yorishiro-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            "out/SHA256SUMS-$GITHUB_REF_NAME"
