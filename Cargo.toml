# One Cargo workspace for our Rust code, so the native addons share one build of godot-rust and the other crates
# (D40). The addons are built and copied by app/build_dependencies.sh; outputs go to target/ here.
[workspace]
resolver = "3"
members = [
	"core",
	"core/gd",
	"app/thirdparty/katashiro",
	"app/thirdparty/katashiro/core",
	"tools/moc3",
]

# debug builds (cargo test) fast enough for the tracking math and model files
[profile.dev]
opt-level = 3
debug = 1

[profile.dev.package.katashiro-core]
opt-level = 3
debug = 0

# symbols for perf and gdb, stripped when packaged
[profile.release]
debug = 1
